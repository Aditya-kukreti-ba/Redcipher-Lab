# ─── RedCipher Labs — Nginx Reverse Proxy Config ─────────────────────────────
# Optional: Use this to serve on port 80 instead of 4000
# Install: sudo apt install nginx
# Place at: /etc/nginx/sites-available/redcipher
# Enable:   sudo ln -s /etc/nginx/sites-available/redcipher /etc/nginx/sites-enabled/
# Restart:  sudo systemctl restart nginx

server {
    listen 80;
    server_name _;   # Replace _ with your domain or Oracle public IP

    # Increase timeout for HuggingFace API calls (can be slow)
    proxy_read_timeout 120s;
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass         http://localhost:4000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://localhost:4000/api/health;
        access_log off;
    }
}
